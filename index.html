<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>UE Node Simplifier</title><style>:root {color-scheme: dark;--bg: #111318;--panel: #181b22;--panel-2: #20242d;--line: #303642;--text: #e9edf4;--muted: #a9b2c1;--accent: #57c7a7;--accent-2: #ffc857;--danger: #ff6b6b;--shadow: rgba(0, 0, 0, 0.25);font-family: "Segoe UI", Arial, sans-serif;}* {box-sizing: border-box;}body {margin: 0;min-height: 100vh;background: var(--bg);color: var(--text);}.app {display: grid;grid-template-rows: auto 1fr;min-height: 100vh;}header {display: flex;align-items: center;justify-content: space-between;gap: 16px;padding: 14px 18px;border-bottom: 1px solid var(--line);background: #151820;}h1 {margin: 0;font-size: 18px;font-weight: 650;letter-spacing: 0;}.toolbar {display: flex;align-items: center;gap: 8px;flex-wrap: wrap;position: relative;}button {border: 1px solid var(--line);background: var(--panel-2);color: var(--text);min-height: 34px;padding: 0 12px;border-radius: 6px;font: inherit;cursor: pointer;}select {border: 1px solid var(--line);background: var(--panel-2);color: var(--text);min-height: 34px;padding: 0 10px;border-radius: 6px;font: inherit;cursor: pointer;}button:hover {border-color: var(--accent);}select:hover {border-color: var(--accent);}.primary {background: var(--accent);border-color: var(--accent);color: #07120f;font-weight: 700;}.workspace {display: grid;grid-template-columns: minmax(320px, 1fr) minmax(320px, 1fr);min-height: 0;}.pane {display: grid;grid-template-rows: auto 1fr auto;min-width: 0;min-height: 0;border-right: 1px solid var(--line);background: var(--panel);}.pane:last-child {border-right: 0;}.pane-title {display: flex;align-items: center;justify-content: space-between;gap: 12px;padding: 10px 12px;border-bottom: 1px solid var(--line);color: var(--muted);font-size: 13px;font-weight: 650;}.stats {color: var(--muted);font-size: 12px;white-space: nowrap;}textarea {width: 100%;height: 100%;min-height: 0;resize: none;border: 0;outline: 0;padding: 14px;background: #101219;color: var(--text);font: 13px/1.45 Consolas, "Cascadia Mono", monospace;tab-size: 2;}#output {margin: 0;width: 100%;height: 100%;min-height: 0;overflow: auto;padding: 14px;background: #101219;color: var(--text);font: 13px/1.45 Consolas, "Cascadia Mono", monospace;white-space: pre-wrap;overflow-wrap: anywhere;resize: none;border: 0;outline: 0;}.footer {display: flex;align-items: center;justify-content: space-between;gap: 12px;padding: 8px 12px;border-top: 1px solid var(--line);color: var(--muted);font-size: 12px;min-height: 34px;}.watermark {position: fixed;left: 50%;bottom: 40px;z-index: 2147483647;color: var(--text);font-size: 48px;font-weight: 700;line-height: 1;opacity: 0.1;pointer-events: none;text-align: center;text-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);transform: translateX(-50%);user-select: none;white-space: nowrap;}.status-ok {color: var(--accent);}.status-warn {color: var(--accent-2);}.status-error {color: var(--danger);}.copy-toast {position: absolute;right: 0;top: calc(100% + 8px);z-index: 5;padding: 8px 12px;border: 1px solid rgba(87, 199, 167, 0.55);border-radius: 6px;background: rgba(20, 31, 30, 0.96);color: var(--text);box-shadow: 0 8px 24px var(--shadow);font-size: 13px;line-height: 1.2;pointer-events: none;opacity: 0;transform: translateY(0);}.copy-toast.show {animation: copyToast 1s ease forwards;}@keyframes copyToast {0% {opacity: 0;transform: translateY(4px);}12% {opacity: 1;transform: translateY(0);}50% {opacity: 1;transform: translateY(0);}100% {opacity: 0;transform: translateY(-16px);}}@media (max-width: 820px) {header {align-items: stretch;flex-direction: column;}.workspace {grid-template-columns: 1fr;grid-template-rows: minmax(320px, 1fr) minmax(320px, 1fr);}.pane {border-right: 0;border-bottom: 1px solid var(--line);}.pane:last-child {border-bottom: 0;}}</style></head><body><main class="app"><header><h1>UE Node Simplifier</h1><div class="toolbar"><select id="languageSelect" aria-label="Language"><option value="auto">Language</option><option value="zh">中文</option><option value="en">English</option></select><button id="copyBtn" type="button" class="primary">Copy Output</button><div id="copyToast" class="copy-toast" role="status" aria-live="polite">已复制到剪切板</div></div></header><section class="workspace" aria-label="Material simplifier workspace"><div class="pane"><div class="pane-title"><span>Raw UE Text</span><span class="stats"><span id="languageState">中文</span> · <span id="inputStats">0 chars</span></span></div><textarea id="input" spellcheck="false" aria-label="Raw UE copied material text"></textarea><div class="footer"><span>Paste copied material text here.</span><span id="parseStatus">Idle</span></div></div><div class="pane"><div class="pane-title"><span>Simplified English Output</span><span id="outputStats" class="stats">0 chars</span></div><textarea id="output" spellcheck="false" readonly aria-label="Simplified material output"></textarea><div class="footer"><span id="summary">No graph loaded.</span><span id="copyStatus"></span></div></div></section></main><script defer src="release-assets/runtime.js"></script><script defer src="release-assets/graph-a.js"></script><script defer src="release-assets/graph-b.js"></script><script defer src="release-assets/graph-c.js"></script><script defer src="release-assets/bootstrap.js"></script></body></html>
